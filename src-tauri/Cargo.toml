[package]
name = "netwatch"
version = "0.1.0"
description = "Live security dashboard for incoming and outgoing network connections"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol embeds ../ui in the binary; without it a plain `cargo build`
# loads the UI from a dev server that this project doesn't have.
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maxminddb = "0.24"
ureq = "2"
flate2 = "1"
dns-lookup = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ferrisetw = "1.2.0"
tauri-plugin-notification = "2"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    "Win32_System_Threading",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
